name: Build Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*'
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $env:GITHUB_ENV

      - name: Build Project (x86 Release)
        run: msbuild SilkroadLauncher/SilkroadLauncher.csproj /p:Configuration=Release /p:Platform=x86

      - uses: actions/upload-artifact@v4
        with:
          name: SilkroadLauncher-${{ env.VERSION }}-x86
          path: SilkroadLauncher/bin/x86/Release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          files: SilkroadLauncher/bin/x86/Release/*